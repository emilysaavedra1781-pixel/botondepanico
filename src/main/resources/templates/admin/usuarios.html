<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de Usuarios</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<body class="admin-body">

    <div class="admin-layout">

        <aside th:replace="~{admin/fragments :: sidebar(${active})}"></aside>

        <main class="admin-main">

            <header class="admin-topbar">
                <div>
                    <h1>Gestion de Usuarios</h1>
                    <p>Control de ciudadanos registrados.</p>
                </div>
            </header>

            <div
                th:if="${exito}"
                class="alert alert-success"
                th:text="${exito}"
            ></div>

            <section class="panel-card mb-3">

                <div class="filter-grid">

                    <input
                        class="form-control"
                        placeholder="Buscar usuario..."
                        data-table-search
                    >

                    <select class="form-select">
                        <option>Estado</option>
                        <option>Activo</option>
                        <option>Inactivo</option>
                        <option>Bloqueado</option>
                    </select>

                    <input
                        class="form-control"
                        placeholder="Distrito"
                    >

                </div>

            </section>

            <section class="panel-card table-card">

                <div class="table-responsive">

                    <table
                        class="table table-hover align-middle"
                        data-search-table
                    >

                        <thead>
                            <tr>
                                <th>Usuario</th>
                                <th>DNI</th>
                                <th>Celular</th>
                                <th>Distrito</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody>

                            <tr th:each="u:${usuarios}">

                                <td th:text="${u.nombre + ' ' + u.apellido}"></td>

                                <td th:text="${u.dni}"></td>

                                <td th:text="${u.celular}"></td>

                                <td th:text="${u.distrito ?: 'No registrado'}"></td>

                                <td>
                                    <span
                                        class="status-pill"
                                        th:classappend="${u.estadoCuenta == 'BLOQUEADO'} ? ' red' : ' green'"
                                        th:text="${u.estadoCuenta ?: 'ACTIVO'}"
                                    ></span>
                                </td>

                                <td class="action-cell">

                                    <button
                                        class="btn btn-sm btn-outline-dark"
                                        type="button"
                                    >
                                        Ver detalle
                                    </button>

                                    <button
                                        class="btn btn-sm btn-outline-secondary"
                                        type="button"
                                    >
                                        Editar
                                    </button>

                                    <form
                                        th:action="@{/admin/usuarios/{id}/bloquear(id=${u.id})}"
                                        method="post"
                                    >
                                        <button
                                            class="btn btn-sm btn-outline-danger"
                                            type="submit"
                                        >
                                            Bloquear
                                        </button>
                                    </form>

                                    <form
                                        th:action="@{/admin/usuarios/{id}/activar(id=${u.id})}"
                                        method="post"
                                    >
                                        <button
                                            class="btn btn-sm btn-red"
                                            type="submit"
                                        >
                                            Activar
                                        </button>
                                    </form>

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/admin.js(v=1)}"></script>

</body>

</html>
