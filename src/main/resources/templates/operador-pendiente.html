<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitud en Revision | Boton de Panico</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/public.css}">
</head>
<body class="public-body">
<main class="public-page">
    <section class="center-shell">
        <article class="simple-card pending-card">
            <div class="pending-icon"><i class="bi bi-hourglass-split"></i></div>
            <span class="kicker"><i class="bi bi-shield-check"></i> Operador pendiente</span>
            <h1 class="page-title">Solicitud en revision</h1>
            <p class="page-subtitle mb-0">Su solicitud esta siendo revisada por un administrador.</p>
            <p class="page-subtitle mt-2">Tu solicitud ha sido enviada correctamente. Un administrador revisara tu informacion y aprobara o rechazara tu acceso.</p>

            <div class="blue-info">
                <i class="bi bi-envelope-check fs-4"></i>
                <div>Recibiras una notificacion por correo electronico.</div>
            </div>

            <a th:href="@{/login}" class="btn btn-emergency w-100">VOLVER AL LOGIN</a>
        </article>
    </section>
</main>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
