<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Home - Botón de Pánico</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          th:href="@{/css/bootstrap.min.css}">

    <!-- CSS -->
    <link rel="stylesheet"
          th:href="@{/css/home.css}">

    <!-- Bootstrap JS -->
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div>

            <h3 class="logo">
                🆘 Botón de Pánico
            </h3>

            <nav class="menu">

                <a href="/home"
                   class="active">

                    🏠 Inicio

                </a>

                <a href="/camara">

                    📷 Cámara

                </a>

                <a href="/notificaciones">

                    🔔 Notificaciones

                </a>

            </nav>

        </div>

        <!-- LOGOUT -->
        <form th:action="@{/logout}"
              method="post">

            <button type="submit"
                    class="logout-btn">

                🚪 Cerrar Sesión

            </button>

        </form>

    </aside>

    <!-- CONTENT -->
    <main class="content">

        <!-- HEADER -->
        <div class="welcome-box">

            <p class="welcome-text">
                Bienvenido
            </p>

            <h1 class="user-name"
                th:text="${nombre} + ' ' + ${apellido}">

                Nombre Usuario

            </h1>

            <span class="status-badge">
                Sistema Activo
            </span>

        </div>

        <!-- TITULO -->
        <div class="section-header">

            <h3>
                ¿Qué tipo de emergencia tienes?
            </h3>

            <p>
                Selecciona rápidamente el tipo de ayuda que necesitas
            </p>

        </div>

        <!-- FORM -->
        <form id="formEmergencia"
              th:action="@{/emergencia/activar}"
              method="post">

            <input type="hidden"
                   id="tipoEmergencia"
                   name="tipoEmergencia"/>

            <input type="hidden"
                   id="latitud"
                   name="latitud"/>

            <input type="hidden"
                   id="longitud"
                   name="longitud"/>

            <input type="hidden"
                   id="ubicacion"
                   name="ubicacion"/>

            <!-- GRID -->
            <div class="cards-grid">

                <!-- MEDICA -->
                <button type="button"
                        onclick="activar('MEDICA')"
                        class="emergency-card medical">

                    <div class="card-icon">
                        🚑
                    </div>

                    <h4>
                        SAMU
                    </h4>

                    <p>
                        Emergencia Médica
                    </p>

                    <span>
                        Línea 106
                    </span>

                </button>

                <!-- BOMBEROS -->
                <button type="button"
                        onclick="activar('INCENDIO')"
                        class="emergency-card fire">

                    <div class="card-icon">
                        🔥
                    </div>

                    <h4>
                        Bomberos
                    </h4>

                    <p>
                        Emergencias e incendios
                    </p>

                    <span>
                        Línea 116
                    </span>

                </button>

                <!-- POLICIA -->
                <button type="button"
                        onclick="activar('SEGURIDAD')"
                        class="emergency-card police">

                    <div class="card-icon">
                        🚔
                    </div>

                    <h4>
                        Policía Nacional
                    </h4>

                    <p>
                        Delitos y seguridad
                    </p>

                    <span>
                        Línea 105
                    </span>

                </button>

                <!-- COMISARIA -->
                <button type="button"
                        onclick="activar('COMISARIA')"
                        class="emergency-card station">

                    <div class="card-icon">
                        🏛️
                    </div>

                    <h4>
                        Comisaría
                    </h4>

                    <p>
                        Contacto distrital
                    </p>

                    <span>
                        Atención local
                    </span>

                </button>

            </div>

        </form>

        <!-- ALERTAS -->
        <div th:if="${alerta == 'enviada'}"
             class="alert alert-success custom-alert mt-4">

            ✅ Alerta enviada correctamente.
            Las autoridades han sido notificadas.

        </div>

        <div id="alertaGPS"
             class="alert alert-warning custom-alert mt-4 d-none">

            ⚠️ No se pudo obtener tu ubicación.

        </div>

    </main>

</div>

<!-- JS -->
<script>

let enviando = false;

function activar(tipo) {

    if (enviando) return;

    enviando = true;

    const numeros = {

        'MEDICA': '+51906404449',

        'INCENDIO': '+51966949238',

        'SEGURIDAD': '+51902581835',

        'COMISARIA': '+51926245992'
    };

    navigator.geolocation.getCurrentPosition(

        function(pos) {

            document.getElementById('tipoEmergencia').value = tipo;

            document.getElementById('latitud').value =
                pos.coords.latitude;

            document.getElementById('longitud').value =
                pos.coords.longitude;

            document.getElementById('ubicacion').value =
                pos.coords.latitude + ", " +
                pos.coords.longitude;

            document.getElementById('formEmergencia').submit();

            setTimeout(() => {

                window.location.href =
                    'tel:' + numeros[tipo];

            }, 800);

        },

        function(error) {

            enviando = false;

            alert(
                "❌ Error GPS: " + error.message
            );
        },

        {
            timeout: 10000
        }
    );
}

</script>

</body>
</html>
