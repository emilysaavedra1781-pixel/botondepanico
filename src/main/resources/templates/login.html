<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Operador - Botón de Pánico</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body class="login-body">

    <!-- PARTICLES -->
    <div id="particles-js"></div>

    <div class="login-container">
        <div class="login-card">

            <div class="text-center mb-4">
                <h2 class="login-title">🆘 Botón de Pánico</h2>
                <p class="login-subtitle">Panel de Operador — Inicia sesión</p>
            </div>

            <div th:if="${error}"
                 class="alert alert-danger text-center"
                 th:text="${error}">
            </div>

            <form th:action="@{/login}" method="post">

                <div class="mb-3">
                    <label class="form-label">Número de Celular</label>
                    <input
                        type="text"
                        name="celular"
                        class="form-control custom-input"
                        placeholder="Ej: 999123456"
                        required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Contraseña</label>
                    <input
                        type="password"
                        name="contrasena"
                        class="form-control custom-input"
                        placeholder="Tu contraseña"
                        required>
                </div>

                <button type="submit" class="btn login-btn">
                🚨 Ingresar al Panel
            </button>

        </form>

        <a href="/" class="login-link-btn mt-3">
            ← Volver a la página principal
        </a>

        <a href="/registro" class="login-link-btn mt-2">
            ¿No tienes cuenta? Regístrate
        </a>

    </div>
</div>

        

<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/login.js}"></script>
</body>
</html>
