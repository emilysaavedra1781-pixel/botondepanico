<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Botón de Pánico</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">

    <!-- CSS Personalizado -->
    <link rel="stylesheet" th:href="@{/css/login.css}">

    <!-- Bootstrap JS -->
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</head>

<body class="login-body">

    <div class="login-container">

        <div class="login-card">

            <div class="text-center mb-4">
                <h2 class="login-title">🆘 Botón de Pánico</h2>
                <p class="login-subtitle">
                    Inicia sesión para continuar
                </p>
            </div>

            <form th:action="@{/login}" method="post">

                <div class="mb-3">
                    <label class="form-label">
                        Número de Celular
                    </label>

                    <input
                            type="text"
                            name="celular"
                            class="form-control custom-input"
                            placeholder="Ej: 999123456"
                            required>
                </div>

                <div class="mb-4">
                    <label class="form-label">
                        Contraseña
                    </label>

                    <input
                            type="password"
                            name="contrasena"
                            class="form-control custom-input"
                            placeholder="Tu contraseña"
                            required>
                </div>

                <!-- Error -->
                <div
                        th:if="${error}"
                        class="alert alert-danger text-center"
                        th:text="${error}">
                </div>

                <!-- Botón -->
                <button type="submit" class="btn btn-danger login-btn">
                    🚨 Ingresar
                </button>

                <!-- Registro -->
                <a href="/registro" class="btn btn-outline-secondary register-btn">
                    ¿No tienes cuenta? Regístrate
                </a>

            </form>

        </div>

    </div>

</body>
</html>
