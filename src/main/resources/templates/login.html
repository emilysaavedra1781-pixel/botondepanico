<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Botón de Pánico</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>

    <!-- 🌟 CSS MODERNO -->
    <style>
        body {
            background: linear-gradient(135deg, #ff4d4d, #ff9999);
            font-family: 'Segoe UI', sans-serif;
        }

        .login-card {
            width: 420px;
            border: none;
            border-radius: 18px;
            padding: 35px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .title {
            font-weight: bold;
            color: #dc3545;
        }

        .subtitle {
            color: #666;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #ddd;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: #dc3545;
            box-shadow: 0 0 8px rgba(220,53,69,0.3);
        }

        .btn-danger {
            border-radius: 12px;
            padding: 10px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-danger:hover {
            transform: scale(1.03);
            background-color: #c82333;
        }

        .btn-outline-secondary {
            border-radius: 12px;
        }

        .alert {
            border-radius: 10px;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100">

<div class="login-card">

    <h3 class="text-center title">🆘 Botón de Pánico</h3>
    <p class="text-center subtitle mb-4">Inicia sesión para continuar</p>

    <form th:action="@{/login}" method="post">

        <div class="mb-3">
            <label class="form-label">Número de Celular</label>
            <input type="text" name="celular" class="form-control"
                   placeholder="Ej: 999123456" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" name="contrasena" class="form-control"
                   placeholder="Tu contraseña" required>
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <button type="submit" class="btn btn-danger w-100">
            🚨 Ingresar
        </button>

        <a href="/registro" class="btn btn-outline-secondary w-100 mt-2">
            ¿No tienes cuenta? Regístrate
        </a>

    </form>
</div>

</body>
</html>
