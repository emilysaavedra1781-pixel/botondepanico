<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Botón de Pánico</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</head>
<body class="bg-danger bg-opacity-10 min-vh-100 d-flex align-items-center justify-content-center">

<div class="card shadow p-4" style="width: 400px;">
    <h3 class="text-center text-danger mb-4">🆘 Botón de Pánico</h3>
    <h5 class="text-center mb-4">Iniciar Sesión</h5>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label">Número de Celular</label>
            <input type="text" name="username" class="form-control" 
                   placeholder="Ej: 999123456" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" name="password" class="form-control" 
                   placeholder="Tu contraseña" required>
        </div>

        <div th:if="${param.error}" class="alert alert-danger">
            Celular o contraseña incorrectos.
        </div>

        <button type="submit" class="btn btn-danger w-100">Ingresar</button>
        <a href="/registro" class="btn btn-outline-secondary w-100 mt-2">
            ¿No tienes cuenta? Regístrate
        </a>
    </form>
</div>

</body>
</html>
