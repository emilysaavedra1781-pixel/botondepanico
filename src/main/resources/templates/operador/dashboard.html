<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Operador | Boton de Panico</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" th:href="@{/css/operador.css}">
</head>

<body class="op-body">

    <div class="op-layout">

        <aside th:replace="~{operador/fragments :: sidebar(${active})}"></aside>

        <main class="op-main">

            <header class="op-topbar">
                <div>
                    <h1 th:text="'¡Hola, ' + ${operador.nombre} + '!'">
                        Hola
                    </h1>

                    <p>
                        Centro de control de emergencias activas.
                    </p>
                </div>

                <span class="status-pill green">
                    <i class="bi bi-circle-fill"></i>
                    En linea
                </span>
            </header>

            <div class="alert alert-danger d-none" data-ws-alert></div>

            <section class="stats-grid">

                <article class="stat-card">
                    <span>Pendientes</span>
                    <strong th:text="${pendientes}">0</strong>
                    <i class="bi bi-hourglass-split"></i>
                </article>

                <article class="stat-card">
                    <span>En atencion</span>
                    <strong th:text="${enAtencion}">0</strong>
                    <i class="bi bi-headset"></i>
                </article>

                <article class="stat-card">
                    <span>Atendidas hoy</span>
                    <strong th:text="${atendidasHoy}">0</strong>
                    <i class="bi bi-check2-circle"></i>
                </article>

                <article class="stat-card">
                    <span>Total emergencias</span>
                    <strong th:text="${totalEmergencias}">0</strong>
                    <i class="bi bi-bar-chart"></i>
                </article>

            </section>

            <div class="op-grid">

                <section class="panel-card">

                    <div class="section-head">
                        <h2>Emergencias pendientes</h2>

                        <a href="/operador/emergencias">
                            Ver todas
                        </a>
                    </div>

                    <div class="case-list">

                        <article
                            th:each="em : ${emergenciasPendientes}"
                            class="case-card"
                        >
                            <div>
                                <strong th:text="${em.tipoEmergencia}">
                                    Tipo
                                </strong>

                                <p th:text="${em.direccion ?: em.ubicacion ?: 'Ubicacion GPS registrada'}">
                                    Direccion
                                </p>

                                <small th:text="${em.distrito ?: 'Distrito no registrado'}">
                                    Distrito
                                </small>
                            </div>

                            <div class="case-actions">
                                <span
                                    class="status-pill red"
                                    th:text="${em.prioridad}"
                                >
                                    ALTA
                                </span>

                                <a
                                    class="btn btn-sm btn-red"
                                    th:href="@{/operador/emergencia/{id}(id=${em.id})}"
                                >
                                    Ver
                                </a>
                            </div>
                        </article>

                        <p
                            th:if="${#lists.isEmpty(emergenciasPendientes)}"
                            class="muted mb-0"
                        >
                            No hay emergencias pendientes.
                        </p>

                    </div>

                </section>

                <section class="panel-card">

                    <div class="section-head">
                        <h2>Mapa de emergencias activas</h2>

                        <a href="/operador/emergencias">
                            Ver mapa completo
                        </a>
                    </div>

                    <div
                        id="operatorMap"
                        class="map-box"
                        th:attr="data-points=${emergenciasActivas}"
                    ></div>

                    <div class="map-points d-none">

                        <span
                            th:each="em : ${emergenciasActivas}"
                            th:data-id="${em.id}"
                            th:data-lat="${em.latitud}"
                            th:data-lng="${em.longitud}"
                            th:data-title="${em.tipoEmergencia}"
                            th:data-status="${em.estado}"
                        ></span>

                    </div>

                </section>

            </div>

        </main>

    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/operador.js(v=1)}"></script>

</body>
</html>
