<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clasificar Emergencia</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/operador.css}">
</head>

<body class="op-body">
    <div class="op-layout">

        <aside th:replace="~{operador/fragments :: sidebar(${active})}"></aside>

        <main class="op-main">

            <header class="op-topbar">
                <div>
                    <h1 th:text="${'Clasificar Emergencia #' + emergencia.id}">
                        Clasificar
                    </h1>
                    <p>Define el tipo, prioridad y descripcion preliminar.</p>
                </div>

                <span class="status-pill blue">EN ATENCION</span>
            </header>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form 
                th:action="@{/operador/emergencia/{id}/clasificar(id=${emergencia.id})}" 
                method="post"
            >

                <section class="type-grid">
                    <label th:each="tipo:${tipos}" class="type-card">
                        <input 
                            type="radio" 
                            name="tipo" 
                            th:value="${tipo}" 
                            th:checked="${tipo.name() == 'ROBO_ASALTO'}"
                        >

                        <span>
                            <i class="bi bi-shield-exclamation"></i>
                            <strong th:text="${tipo.etiqueta}"></strong>
                        </span>
                    </label>
                </section>

                <section class="panel-card mt-3">
                    <div class="row g-3">

                        <div class="col-md-4">
                            <label class="form-label">Prioridad</label>

                            <select class="form-select" name="prioridad">
                                <option 
                                    th:each="p:${prioridades}" 
                                    th:value="${p}" 
                                    th:text="${p}"
                                ></option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label">
                                Descripcion preliminar del caso
                            </label>

                            <textarea 
                                class="form-control" 
                                name="descripcionOperador" 
                                rows="6" 
                                required 
                                placeholder="Describe la situacion reportada por el usuario..."
                            ></textarea>
                        </div>

                    </div>
                </section>

                <section class="action-bar">
                    <button class="btn btn-red" type="submit">
                        <i class="bi bi-save"></i>
                        Guardar y continuar
                    </button>

                    <a 
                        class="btn btn-outline-secondary" 
                        th:href="@{/operador/emergencia/{id}(id=${emergencia.id})}"
                    >
                        Cancelar
                    </a>
                </section>

            </form>

        </main>
    </div>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
