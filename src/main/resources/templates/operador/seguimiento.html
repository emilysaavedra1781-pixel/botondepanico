<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" th:href="@{/css/operador.css}">
</head>

<body class="op-body">
    <div class="op-layout">

        <aside th:replace="~{operador/fragments :: sidebar(${active})}"></aside>

        <main class="op-main">

            <header class="op-topbar">
                <div>
                    <h1 th:text="${'Seguimiento de Emergencia #' + emergencia.id}">
                        Seguimiento
                    </h1>

                    <p>Monitoreo operativo del incidente.</p>
                </div>

                <span
                    class="status-pill blue"
                    th:text="${emergencia.estado}"
                >
                    EN ATENCION
                </span>
            </header>

            <div
                th:if="${exito}"
                class="alert alert-success"
                th:text="${exito}"
            ></div>

            <section class="panel-card">

                <ul class="nav nav-tabs" role="tablist">

                    <li class="nav-item">
                        <button
                            class="nav-link active"
                            data-bs-toggle="tab"
                            data-bs-target="#mapa"
                            type="button"
                        >
                            Mapa en tiempo real
                        </button>
                    </li>

                    <li class="nav-item">
                        <button
                            class="nav-link"
                            data-bs-toggle="tab"
                            data-bs-target="#comunicacion"
                            type="button"
                        >
                            Comunicacion
                        </button>
                    </li>

                    <li class="nav-item">
                        <button
                            class="nav-link"
                            data-bs-toggle="tab"
                            data-bs-target="#evidencias"
                            type="button"
                        >
                            Evidencias
                        </button>
                    </li>

                    <li class="nav-item">
                        <button
                            class="nav-link"
                            data-bs-toggle="tab"
                            data-bs-target="#info"
                            type="button"
                        >
                            Informacion
                        </button>
                    </li>

                </ul>

                <div class="tab-content pt-3">

                    <div class="tab-pane fade show active" id="mapa">

                        <div class="op-grid">

                            <div
                                id="trackingMap"
                                class="map-box tall"
                                th:data-lat="${emergencia.latitud}"
                                th:data-lng="${emergencia.longitud}"
                                th:data-title="${emergencia.tipoEmergencia}"
                            ></div>

                            <aside class="tracking-panel">

                                <div>
                                    <span>Estado</span>
                                    <strong th:text="${emergencia.estado}"></strong>
                                </div>

                                <div>
                                    <span>Tiempo transcurrido</span>
                                    <strong
                                        data-elapsed
                                        th:data-start="${emergencia.fecha}"
                                    >
                                        Calculando
                                    </strong>
                                </div>

                                <div>
                                    <span>Distancia aproximada</span>
                                    <strong data-distance>
                                        Calculando
                                    </strong>
                                </div>

                                <div>
                                    <span>Ultima actualizacion</span>
                                    <strong th:text="${#temporals.format(emergencia.fechaActualizacion,'HH:mm:ss')}"></strong>
                                </div>

                            </aside>

                        </div>

                    </div>

                    <div class="tab-pane fade" id="comunicacion">

                        <a
                            class="btn btn-red mb-3"
                            th:href="${'tel:' + emergencia.usuario.celular}"
                        >
                            <i class="bi bi-telephone"></i>
                            Llamar usuario
                        </a>

                        <textarea
                            class="form-control"
                            rows="7"
                            placeholder="Registro de notas del operador"
                        ></textarea>

                    </div>

                    <div class="tab-pane fade" id="evidencias">

                        <div class="evidence-grid">

                            <article
                                th:each="ev:${evidencias}"
                                class="evidence-card"
                            >
                                <strong th:text="${ev.nombreArchivo}"></strong>

                                <small th:text="${ev.tipo}"></small>

                                <img
                                    th:if="${#strings.startsWith(ev.contentType ?: '', 'image/')}"
                                    th:src="@{/usuario/evidencia/{id}/archivo(id=${ev.id})}"
                                    alt="Evidencia"
                                >

                                <video
                                    th:if="${#strings.startsWith(ev.contentType ?: '', 'video/')}"
                                    controls
                                    th:src="@{/usuario/evidencia/{id}/archivo(id=${ev.id})}"
                                ></video>
                            </article>

                            <p
                                th:if="${#lists.isEmpty(evidencias)}"
                                class="muted"
                            >
                                No hay evidencias.
                            </p>

                        </div>

                    </div>

                    <div class="tab-pane fade" id="info">

                        <div class="info-grid wide">

                            <span>Tipo</span>
                            <strong th:text="${emergencia.tipoEmergencia}"></strong>

                            <span>Usuario</span>
                            <strong th:text="${emergencia.usuario.nombre + ' ' + emergencia.usuario.apellido}"></strong>

                            <span>Distrito</span>
                            <strong th:text="${emergencia.distrito ?: 'No registrado'}"></strong>

                            <span>Direccion</span>
                            <strong th:text="${emergencia.direccion ?: emergencia.ubicacion ?: 'No registrada'}"></strong>

                            <span>Descripcion operador</span>
                            <strong th:text="${emergencia.descripcionOperador ?: 'Sin descripcion'}"></strong>

                        </div>

                    </div>

                </div>

            </section>

            <section class="action-bar">

                <a
                    class="btn btn-red"
                    th:href="@{/operador/emergencia/{id}/notificar(id=${emergencia.id})}"
                >
                    <i class="bi bi-send"></i>
                    Notificar autoridad
                </a>

                <form
                    th:action="@{/operador/emergencia/{id}/finalizar(id=${emergencia.id})}"
                    method="post"
                >
                    <button class="btn btn-outline-dark" type="submit">
                        <i class="bi bi-flag"></i>
                        Marcar emergencia resuelta
                    </button>
                </form>

            </section>

        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/operador.js(v=1)}"></script>
</body>
</html>
