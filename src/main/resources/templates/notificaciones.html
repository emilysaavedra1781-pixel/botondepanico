        <form th:action="@{/logout}"

            <button type="submit"
                    class="logout-btn">

    <main class="content">

        <div class="page-header">

            <div>

                <h2>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

<script>

const API_KEY = 'TU_API_KEY';

async function buscarNoticias(query) {

    document.getElementById('cargando').style.display = 'flex';

    document.getElementById('lista-noticias').innerHTML = '';

    try {

        const url =
            `https://newsapi.org/v2/everything?q=${encodeURIComponent(query)}&language=es&sortBy=publishedAt&pageSize=10&apiKey=${API_KEY}`;

        const response = await fetch(url);

        const data = await response.json();

        document.getElementById('cargando').style.display = 'none';

        if (data.articles && data.articles.length > 0) {

            data.articles.forEach(article => {

                const fecha =
                    new Date(article.publishedAt)
                    .toLocaleDateString('es-PE');

                document.getElementById('lista-noticias').innerHTML += `

                    <div class="news-card">

                        <div class="news-top">

                            <span class="news-badge">
                                ${query.split(' ')[0].toUpperCase()}
                            </span>

                            <small>
                                ${fecha}
                            </small>

                        </div>

                        <h5>
                            ${article.title}
                        </h5>

                        <p>
                            ${article.description || ''}
                        </p>

                        <a href="${article.url}"
                           target="_blank"
                           class="news-btn">

                            Ver noticia

                        </a>

                    </div>

                `;
            });

        } else {

            document.getElementById('lista-noticias').innerHTML = `

                <div class="alert alert-info">

                    No se encontraron noticias recientes.

                </div>

            `;
        }

    } catch (error) {

        document.getElementById('cargando').style.display = 'none';

        document.getElementById('lista-noticias').innerHTML = `

            <div class="alert alert-danger">

                Error al cargar noticias.

            </div>

        `;
    }
}

buscarNoticias('emergencia Lima');

</script>

</body>
