<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notificaciones - Botón de Pánico</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">

    <style>
        body {
            background: #f4f6f9;
        }

        .sidebar {
            min-height: 100vh;
            width: 240px;
            background: linear-gradient(180deg, #c0392b, #922b21);
            box-shadow: 2px 0 10px rgba(0,0,0,0.15);
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 14px 18px;
            display: block;
            border-radius: 8px;
            margin-bottom: 5px;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background: rgba(255,255,255,0.15);
            transform: translateX(5px);
        }

        .content {
            padding: 25px;
        }

        .card-notificacion {
            border: none;
            border-left: 6px solid #c0392b;
            border-radius: 14px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            margin-bottom: 15px;
            transition: 0.2s;
        }

        .card-notificacion:hover {
            transform: scale(1.01);
        }

        .badge-tipo {
            font-size: 0.75rem;
            padding: 6px 10px;
            border-radius: 8px;
        }

        .btn {
            border-radius: 10px;
            font-weight: 600;
        }

        .btn:hover {
            transform: scale(1.05);
            transition: 0.2s;
        }

        h3 {
            font-weight: 700;
        }

        #cargando {
            margin-top: 40px;
        }
    </style>
</head>

<body>

<div class="d-flex">

    <!-- Sidebar -->
    <div class="sidebar d-flex flex-column p-3">
        <h5 class="text-white text-center mb-4">🆘 Botón de Pánico</h5>

        <a href="/home">🏠 Inicio</a>
        <a href="/camara">📷 Cámara</a>
        <a href="/notificaciones">🔔 Notificaciones</a>

        <div class="mt-auto">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn text-white w-100 text-start ps-0">
                    🚪 Cerrar Sesión
                </button>
            </form>
        </div>
    </div>

    <!-- Contenido -->
    <div class="flex-grow-1 content">

        <h3 class="text-danger mb-1">🔔 Notificaciones</h3>
        <p class="text-muted mb-4">Emergencias reportadas cerca de tu zona</p>

        <!-- filtros -->
        <div class="mb-3 d-flex gap-2 flex-wrap">
            <button class="btn btn-danger btn-sm" onclick="buscarNoticias('accidente Lima')">
                🚑 Accidentes
            </button>
            <button class="btn btn-warning btn-sm" onclick="buscarNoticias('incendio Lima')">
                🔥 Incendios
            </button>
            <button class="btn btn-dark btn-sm" onclick="buscarNoticias('robo Lima')">
                🔫 Robos
            </button>
            <button class="btn btn-secondary btn-sm" onclick="buscarNoticias('emergencia Lima')">
                🆘 General
            </button>
        </div>

        <!-- loading -->
        <div id="cargando" style="display:none;" class="text-center">
            <div class="spinner-border text-danger"></div>
            <p class="mt-2 text-muted">Buscando noticias...</p>
        </div>

        <!-- noticias -->
        <div id="lista-noticias"></div>

    </div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

<script>
const API_KEY = 'dad24006bebd45329f14e5126a48ab63';

async function buscarNoticias(query) {
    document.getElementById('cargando').style.display = 'block';
    document.getElementById('lista-noticias').innerHTML = '';

    try {
        const url = `https://newsapi.org/v2/everything?q=${encodeURIComponent(query)}&language=es&sortBy=publishedAt&pageSize=10&apiKey=${API_KEY}`;

        const response = await fetch(url);
        const data = await response.json();

        document.getElementById('cargando').style.display = 'none';

        if (data.articles && data.articles.length > 0) {

            data.articles.forEach(article => {

                const fecha = new Date(article.publishedAt).toLocaleDateString('es-PE');

                document.getElementById('lista-noticias').innerHTML += `
                    <div class="card card-notificacion">
                        <div class="card-body">

                            <div class="d-flex justify-content-between mb-2">
                                <span class="badge bg-danger badge-tipo">
                                    ${query.split(' ')[0].toUpperCase()}
                                </span>
                                <small class="text-muted">${fecha}</small>
                            </div>

                            <h6 class="fw-bold">${article.title}</h6>

                            <p class="text-muted small">
                                ${article.description || ''}
                            </p>

                            <a href="${article.url}" target="_blank"
                               class="btn btn-outline-danger btn-sm">
                                Ver noticia
                            </a>

                        </div>
                    </div>`;
            });

        } else {
            document.getElementById('lista-noticias').innerHTML =
                '<div class="alert alert-info">No se encontraron noticias recientes.</div>';
        }

    } catch (error) {
        document.getElementById('cargando').style.display = 'none';
        document.getElementById('lista-noticias').innerHTML =
            '<div class="alert alert-danger">Error al cargar noticias.</div>';
    }
}

// inicial
buscarNoticias('emergencia Lima');
</script>

</body>
</html>
