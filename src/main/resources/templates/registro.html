<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro - Botón de Pánico</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">

    <style>
        body {
            background: linear-gradient(135deg, #f8d7da, #ffffff);
        }

        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        h3 {
            font-weight: 800;
        }

        .form-control {
            border-radius: 10px;
            padding: 10px;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.2rem rgba(220,53,69,0.25);
            border-color: #dc3545;
        }

        .btn {
            border-radius: 10px;
            font-weight: 600;
            padding: 10px;
        }

        .btn-danger {
            background: linear-gradient(90deg, #dc3545, #c0392b);
            border: none;
        }

        .btn-danger:hover {
            transform: scale(1.02);
            transition: 0.2s;
        }

        .btn-outline-secondary {
            border-radius: 10px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
        }
    </style>
</head>

<body class="min-vh-100 d-flex align-items-center justify-content-center">

<div class="card p-4" style="width: 520px;">

    <h3 class="text-center text-danger mb-2">🆘 Botón de Pánico</h3>
    <p class="text-center text-muted mb-4">Crear una cuenta nueva</p>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/registro}" th:object="${usuario}" method="post">

        <div class="row">
            <div class="col mb-3">
                <label>Nombre</label>
                <input type="text" th:field="*{nombre}" class="form-control" required>
            </div>
            <div class="col mb-3">
                <label>Apellido</label>
                <input type="text" th:field="*{apellido}" class="form-control" required>
            </div>
        </div>

        <div class="mb-3">
            <label>DNI</label>
            <input type="text" th:field="*{dni}" class="form-control" maxlength="8" required>
        </div>

        <div class="mb-3">
            <label>Celular</label>
            <input type="text" th:field="*{celular}" class="form-control" maxlength="9" required>
        </div>

        <div class="mb-3">
            <label>Correo Electrónico</label>
            <input type="email" th:field="*{correo}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Distrito</label>
            <input type="text" th:field="*{distrito}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Contraseña</label>
            <input type="password" th:field="*{password}" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-danger w-100">
            Registrarse
        </button>

        <a href="/login" class="btn btn-outline-secondary w-100 mt-2">
            ¿Ya tienes cuenta? Inicia sesión
        </a>

    </form>

</div>

</body>
</html>
