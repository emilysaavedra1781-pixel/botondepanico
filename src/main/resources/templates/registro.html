<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro - Botón de Pánico</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>git init
</head>
<body class="bg-danger bg-opacity-10 min-vh-100 d-flex align-items-center justify-content-center">

<div class="card shadow p-4" style="width: 480px;">
    <h3 class="text-center text-danger mb-4">🆘 Botón de Pánico</h3>
    <h5 class="text-center mb-4">Crear Cuenta</h5>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/registro}" th:object="${usuario}" method="post">
        <div class="row">
            <div class="col mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" th:field="*{nombre}" class="form-control" 
                       placeholder="Tu nombre" required>
            </div>
            <div class="col mb-3">
                <label class="form-label">Apellido</label>
                <input type="text" th:field="*{apellido}" class="form-control" 
                       placeholder="Tu apellido" required>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">DNI</label>
            <input type="text" th:field="*{dni}" class="form-control" 
                   placeholder="Tu DNI" maxlength="8" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Número de Celular</label>
            <input type="text" th:field="*{celular}" class="form-control" 
                   placeholder="Ej: 999123456" maxlength="9" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Correo Electrónico</label>
            <input type="email" th:field="*{correo}" class="form-control" 
                   placeholder="correo@ejemplo.com" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Distrito</label>
            <input type="text" th:field="*{distrito}" class="form-control" 
                   placeholder="Tu distrito en Lima" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" th:field="*{password}" class="form-control" 
                   placeholder="Mínimo 6 caracteres" required>
        </div>

        <button type="submit" class="btn btn-danger w-100">Registrarse</button>
        <a href="/login" class="btn btn-outline-secondary w-100 mt-2">
            ¿Ya tienes cuenta? Inicia sesión
        </a>
    </form>
</div>

</body>
</html>
