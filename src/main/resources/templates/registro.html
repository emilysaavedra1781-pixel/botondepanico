<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registro - Botón de Pánico</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          th:href="@{/css/bootstrap.min.css}">

    <!-- CSS -->
    <link rel="stylesheet"
          th:href="@{/css/registro.css}">

    <!-- Bootstrap JS -->
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</head>

<body class="register-body">

<div class="register-container">

    <div class="register-card">

        <!-- TITULO -->
        <div class="text-center mb-4">

            <h2 class="register-title">
                🆘 Botón de Pánico
            </h2>

            <p class="register-subtitle">
                Crear una cuenta nueva
            </p>

        </div>

        <!-- ERROR -->
        <div th:if="${error}"
             class="alert alert-danger text-center"
             th:text="${error}">
        </div>

        <!-- FORM -->
        <form th:action="@{/registro}"
              th:object="${usuario}"
              method="post">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Nombre
                    </label>

                    <input type="text"
                           th:field="*{nombre}"
                           class="form-control custom-input"
                           placeholder="Ingresa tu nombre"
                           required>

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Apellido
                    </label>

                    <input type="text"
                           th:field="*{apellido}"
                           class="form-control custom-input"
                           placeholder="Ingresa tu apellido"
                           required>

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    DNI
                </label>

                <input type="text"
                       th:field="*{dni}"
                       class="form-control custom-input"
                       maxlength="8"
                       placeholder="12345678"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Celular
                </label>

                <input type="text"
                       th:field="*{celular}"
                       class="form-control custom-input"
                       maxlength="9"
                       placeholder="999123456"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Correo Electrónico
                </label>

                <input type="email"
                       th:field="*{correo}"
                       class="form-control custom-input"
                       placeholder="correo@gmail.com"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Distrito
                </label>

                <input type="text"
                       th:field="*{distrito}"
                       class="form-control custom-input"
                       placeholder="Tu distrito"
                       required>

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Contraseña
                </label>

                <input type="password"
                       th:field="*{password}"
                       class="form-control custom-input"
                       placeholder="Tu contraseña"
                       required>

            </div>

            <!-- BOTON -->
            <button type="submit"
                    class="btn register-btn">

                Registrarse

            </button>

            <!-- LOGIN -->
            <a href="/login"
               class="btn login-link-btn">

                ¿Ya tienes cuenta? Inicia sesión

            </a>

        </form>

    </div>

</div>

</body>
</html>
