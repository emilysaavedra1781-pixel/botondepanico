<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Boton de Panico</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/public.css}">
</head>
<body class="public-body">
<main class="public-page">
    <section class="center-shell">
        <header class="public-header">
            <span class="kicker"><i class="bi bi-person-plus"></i> Registro publico</span>
            <h1 class="page-title">Crear Cuenta</h1>
            <p class="page-subtitle">¿Que tipo de cuenta deseas crear?</p>
        </header>

        <div class="register-grid">
            <article class="choice-card">
                <div class="choice-icon"><i class="bi bi-person"></i></div>
                <h2>USUARIO</h2>
                <p>Solicitar ayuda en situaciones de emergencia.</p>
                <a th:href="@{/registro-usuario}" class="btn btn-emergency w-100">CREAR CUENTA</a>
            </article>

        </div>

        <div class="text-center mt-4">
            <a th:href="@{/login}"><i class="bi bi-arrow-left"></i> Volver al login</a>
        </div>
    </section>
</main>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
