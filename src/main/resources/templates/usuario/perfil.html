<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Perfil Usuario</title><link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" th:href="@{/css/usuario.css}"></head><body class="user-body"><div class="user-layout"><aside class="user-sidebar"><div class="user-brand"><div class="user-brand-icon">SOS</div><div><strong>Boton de Panico</strong><span>Emergencias Lima</span></div></div><nav class="user-nav"><a href="/usuario/dashboard"><i class="bi bi-house"></i>Inicio</a><a href="/usuario/emergencia-activa"><i class="bi bi-exclamation-triangle"></i>Emergencia Activa</a><a href="/usuario/evidencias"><i class="bi bi-folder2-open"></i>Mis evidencias</a><a href="/usuario/historial"><i class="bi bi-clock-history"></i>Historial</a><a class="active" href="/usuario/perfil"><i class="bi bi-person"></i>Mi Perfil</a><a href="/logout"><i class="bi bi-box-arrow-right"></i>Cerrar Sesion</a></nav></aside><main class="user-main"><header class="user-topbar"><div><h1>Mi Perfil</h1><p>Administra tus datos personales y seguridad.</p></div><div class="user-avatar" th:text="${#strings.substring(usuario.nombre,0,1)}">U</div></header><div class="grid-2"><section class="panel-card"><div class="d-flex align-items-center gap-4 mb-4"><div class="profile-photo"><i class="bi bi-person"></i></div><div><h2 class="card-title mb-1" th:text="${usuario.nombre + ' ' + usuario.apellido}"></h2><span class="status-pill green" th:text="${usuario.estadoCuenta ?: 'ACTIVO'}"></span></div></div><div class="row g-3"><div class="col-md-6"><label class="form-label">Nombre</label><input class="form-control" th:value="${usuario.nombre}" readonly></div><div class="col-md-6"><label class="form-label">DNI</label><input class="form-control" th:value="${usuario.dni}" readonly></div><div class="col-md-6"><label class="form-label">Correo</label><input class="form-control" th:value="${usuario.correo}" readonly></div><div class="col-md-6"><label class="form-label">Celular</label><input class="form-control" th:value="${usuario.celular}" readonly></div><div class="col-md-6"><label class="form-label">Distrito</label><input class="form-control" th:value="${usuario.distrito}" readonly></div><div class="col-md-6"><label class="form-label">Fecha de registro</label><input class="form-control" th:value="${usuario.fechaRegistro != null ? #temporals.format(usuario.fechaRegistro,'dd/MM/yyyy') : 'No registrada'}" readonly></div></div></section><aside class="panel-card"><h2 class="card-title">Opciones</h2><div class="d-grid gap-3"><button class="btn btn-outline-secondary" type="button">Editar perfil</button><button class="btn btn-outline-secondary" type="button">Cambiar contrasena</button><a class="btn btn-red" href="/logout">Cerrar sesion</a></div></aside></div></main></div><script th:src="@{/js/bootstrap.bundle.min.js}"></script></body></html>
