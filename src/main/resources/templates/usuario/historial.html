<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Historial</title><link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"><link rel="stylesheet" th:href="@{/css/usuario.css}"></head><body class="user-body"><div class="user-layout"><aside class="user-sidebar"><div class="user-brand"><div class="user-brand-icon">SOS</div><div><strong>Boton de Panico</strong><span>Emergencias Lima</span></div></div><nav class="user-nav"><a href="/usuario/dashboard"><i class="bi bi-house"></i>Inicio</a><a href="/usuario/emergencia-activa"><i class="bi bi-exclamation-triangle"></i>Emergencia Activa</a><a href="/usuario/evidencias"><i class="bi bi-folder2-open"></i>Mis evidencias</a><a class="active" href="/usuario/historial"><i class="bi bi-clock-history"></i>Historial</a><a href="/usuario/perfil"><i class="bi bi-person"></i>Mi Perfil</a><a href="/logout"><i class="bi bi-box-arrow-right"></i>Cerrar Sesion</a></nav></aside><main class="user-main"><header class="user-topbar"><div><h1>Historial de Emergencias</h1><p>Consulta tus emergencias registradas y su estado.</p></div><div class="user-avatar" th:text="${#strings.substring(usuario.nombre,0,1)}">U</div></header><section class="panel-card mb-3"><div class="row g-3"><div class="col-md-4"><input class="form-control" type="date" aria-label="Filtrar por fecha"></div><div class="col-md-4"><select class="form-select"><option>Todos los estados</option><option>Pendiente</option><option>En Atencion</option><option>Resuelta</option></select></div><div class="col-md-4"><select class="form-select"><option>Todos los tipos</option><option>Robo o asalto</option><option>Emergencia medica</option><option>Incendio</option></select></div></div></section><section class="panel-card table-card"><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Fecha</th><th>Hora</th><th>Tipo</th><th>Distrito</th><th>Estado</th><th></th></tr></thead><tbody><tr th:each="em : ${emergencias}"><td th:text="${#temporals.format(em.fecha,'dd/MM/yyyy')}"></td><td th:text="${#temporals.format(em.fecha,'HH:mm')}"></td><td th:text="${em.tipoEmergencia}"></td><td th:text="${em.distrito ?: 'No registrado'}"></td><td><span class="status-pill blue" th:text="${em.estado}"></span></td><td><a th:href="@{/usuario/emergencia/{id}(id=${em.id})}" class="btn btn-sm btn-outline-danger">Ver detalle</a></td></tr><tr th:if="${#lists.isEmpty(emergencias)}"><td colspan="6" class="text-center muted py-4">No hay emergencias registradas.</td></tr></tbody></table></div></section></main></div><script th:src="@{/js/bootstrap.bundle.min.js}"></script></body></html>
